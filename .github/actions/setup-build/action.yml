name: Set up Android build
description: Installs JDK, Android SDK and Gradle, and recreates the git-ignored config files from secrets.

inputs:
  local-properties:
    description: Contents of local.properties (sdk.dir is set automatically)
    required: true
  google-services-json:
    description: Base64 of app/google-services.json
    required: true
  keystore-base64:
    description: Base64 of the release keystore (.jks). Leave empty for debug-only builds.
    required: false
    default: ''
  key-alias:
    required: false
    default: ''
  key-password:
    required: false
    default: ''
  store-password:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Open-source cache backed by actions/cache (the v6 default is a commercial service)
        cache-provider: basic

    - name: Check required secrets
      shell: bash
      env:
        LOCAL_PROPERTIES: ${{ inputs.local-properties }}
        GOOGLE_SERVICES_JSON: ${{ inputs.google-services-json }}
      run: |
        missing=0
        [ -z "$LOCAL_PROPERTIES" ] && echo "::error::Missing secret LOCAL_PROPERTIES" && missing=1
        [ -z "$GOOGLE_SERVICES_JSON" ] && echo "::error::Missing secret GOOGLE_SERVICES_JSON" && missing=1
        exit $missing

    - name: Create local.properties and google-services.json
      shell: bash
      env:
        LOCAL_PROPERTIES: ${{ inputs.local-properties }}
        GOOGLE_SERVICES_JSON: ${{ inputs.google-services-json }}
      run: |
        chmod +x ./gradlew
        printf '%s\n' "$LOCAL_PROPERTIES" | grep -v '^sdk.dir=' > local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
        echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

    # The build script always loads keystore.properties. With no keystore secret a
    # placeholder is written, which is fine for debug builds (they don't use it).
    - name: Create keystore.properties
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
        STORE_PASSWORD: ${{ inputs.store-password }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          for v in KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            [ -z "${!v}" ] && echo "::error::Missing secret $v" && exit 1
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > app_signing_key.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
            echo "storeFile=../app_signing_key.jks"
          } > keystore.properties
        else
          printf 'keyAlias=ci\nkeyPassword=ci\nstorePassword=ci\nstoreFile=ci.jks\n' > keystore.properties
        fi
